[workspace]

resolver = "3"

members = [
    "crates/cgp-serde",
    "crates/cgp-serde-extra",
    "crates/cgp-serde-json",
    "crates/cgp-serde-alloc",
    "crates/cgp-serde-typed-arena",
    "crates/cgp-serde-tests",
    "crates/cgp-serde-examples",
]

[workspace.package]
rust-version    = "1.90"
edition         = "2024"
license         = "MIT"
repository      = "https://github.com/contextgeneric/cgp-serde"
homepage        = "https://contextgeneric.dev/docs/projects/cgp-serde/"
categories      = ["encoding", "rust-patterns"]
authors         = ["Soares Chen <soares.chen@maybevoid.com>"]
keywords        = ["cgp", "serde", "serialization", "coherence"]

[workspace.dependencies]
cgp                 = { version = "0.8.0-prerelease" }
cgp-error-anyhow    = { version = "0.8.0-prerelease" }
serde               = { version = "1.0.229" }
serde_json          = { version = "1.0.154" }
hex                 = { version = "0.4.3" }
base64              = { version = "0.22.1" }
chrono              = { version = "0.4.45" }
typed-arena         = { version = "2.0.2" }
ron                 = { version = "0.12.3" }
postcard            = { version = "1.1.3", default-features = false, features = ["alloc"] }
trybuild            = { version = "1.0.125" }

cgp-serde               = { version = "0.3.0-prerelease", path = "./crates/cgp-serde" }
cgp-serde-extra         = { version = "0.3.0-prerelease", path = "./crates/cgp-serde-extra" }
cgp-serde-json          = { version = "0.3.0-prerelease", path = "./crates/cgp-serde-json" }
cgp-serde-alloc         = { version = "0.3.0-prerelease", path = "./crates/cgp-serde-alloc" }
cgp-serde-typed-arena   = { version = "0.3.0-prerelease", path = "./crates/cgp-serde-typed-arena" }
